<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{staff/layout :: layout('Quản lý giao hàng', 'delivery', ~{::pageContent})}">
<body>
<th:block th:fragment="pageContent">
<section class="page-content delivery-page">
<div class="page-heading">
                <div>
                    <h2>Quản lý giao hàng</h2>
                    <p>Theo dõi các đơn hàng đang chờ giao và tiến độ giao hàng</p>
                </div>
            </div>

            <!-- THỐNG KÊ GIAO HÀNG -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-top">
                        Chờ bàn giao
                        <div class="stat-icon"><i class="fa-solid fa-box"></i></div>
                    </div>
                    <div class="stat-number" id="waitingOrders">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-top">
                        Đang giao
                        <div class="stat-icon"><i class="fa-solid fa-motorcycle"></i></div>
                    </div>
                    <div class="stat-number" id="deliveringOrders">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-top">
                        Giao thành công
                        <div class="stat-icon"><i class="fa-solid fa-circle-check"></i></div>
                    </div>
                    <div class="stat-number" id="deliveredOrders">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-top">
                        Giao thất bại
                        <div class="stat-icon"><i class="fa-solid fa-circle-exclamation"></i></div>
                    </div>
                    <div class="stat-number" id="failedOrders">0</div>
                </div>
            </div>

            <!-- BỘ LỌC -->
            <div class="filter-card">
                <div class="filter-title">
                    <i class="fa-solid fa-filter"></i>
                    Tìm kiếm và lọc đơn giao hàng
                </div>

                <div class="filter-grid">
                    <input type="text" id="searchDelivery"
                           placeholder="Tìm mã đơn hoặc tên khách hàng...">

                    <select id="deliveryStatus">
                        <option value="">Tất cả trạng thái</option>
                        <option value="WAITING">Chờ bàn giao</option>
                        <option value="DELIVERING">Đang giao</option>
                        <option value="DELIVERED">Giao thành công</option>
                        <option value="FAILED">Giao thất bại</option>
                    </select>

                    <input type="date" id="deliveryDate">
                </div>
            </div>

            <!-- DANH SÁCH ĐƠN -->
            <div class="table-card">
                <div class="table-header">
                    <h3>Danh sách đơn giao hàng</h3>
                    <span id="deliveryResultCount">0 đơn hàng</span>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Mã đơn</th>
                                <th>Khách hàng</th>
                                <th>Thời gian đặt</th>
                                <th>Tổng tiền</th>
                                <th>Trạng thái</th>
                                <th>Cập nhật</th>
                            </tr>
                        </thead>
                        <tbody id="deliveryTableBody"></tbody>
                    </table>
                </div>

                <div class="pagination">
                    <span id="deliveryPageInfo">Trang 1</span>
                    <div>
                        <button id="deliveryPrevPage" type="button">Trước</button>
                        <button id="deliveryNextPage" type="button">Sau</button>
                    </div>
                </div>
            </div>
</section>
<script>

    // Ngày hiện tại theo múi giờ máy người dùng
    const now = new Date();
    const todayISO = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;

    // Dữ liệu minh họa giao hàng - sẽ thay bằng dữ liệu database sau
    const deliveryOrders = [
        { id: "DH2001", customer: "Nguyễn Văn An", time: "09:30", date: todayISO, total: 75000, status: "WAITING" },
        { id: "DH2002", customer: "Trần Thị Bình", time: "10:15", date: todayISO, total: 120000, status: "DELIVERING" },
        { id: "DH2003", customer: "Lê Hoàng Nam", time: "10:45", date: todayISO, total: 95000, status: "DELIVERING" },
        { id: "DH2004", customer: "Phạm Minh Anh", time: "11:20", date: todayISO, total: 65000, status: "DELIVERED" },
        { id: "DH2005", customer: "Nguyễn Thị Hoa", time: "12:00", date: todayISO, total: 145000, status: "FAILED" },
        { id: "DH2006", customer: "Trần Quốc Bảo", time: "13:10", date: todayISO, total: 85000, status: "WAITING" }
    ];

    const deliveryStatusNames = {
        WAITING: "Chờ bàn giao",
        DELIVERING: "Đang giao",
        DELIVERED: "Giao thành công",
        FAILED: "Giao thất bại"
    };

    const deliveryStatusClasses = {
        WAITING: "waiting",
        DELIVERING: "delivering",
        DELIVERED: "delivered",
        FAILED: "failed"
    };

    let deliveryCurrentPage = 1;
    const deliveryPageSize = 5;

    function formatDeliveryMoney(amount) {
        return amount.toLocaleString("vi-VN") + " ₫";
    }

    function updateDeliveryStatistics() {
        document.getElementById("waitingOrders").textContent =
            deliveryOrders.filter(o => o.status === "WAITING").length;
        document.getElementById("deliveringOrders").textContent =
            deliveryOrders.filter(o => o.status === "DELIVERING").length;
        document.getElementById("deliveredOrders").textContent =
            deliveryOrders.filter(o => o.status === "DELIVERED").length;
        document.getElementById("failedOrders").textContent =
            deliveryOrders.filter(o => o.status === "FAILED").length;
    }

    function renderDeliveryOrders() {
        const keyword = document.getElementById("searchDelivery").value.trim().toLowerCase();
        const status = document.getElementById("deliveryStatus").value;
        const date = document.getElementById("deliveryDate").value;

        const filtered = deliveryOrders.filter(order => {
            const matchesKeyword = order.id.toLowerCase().includes(keyword) ||
                order.customer.toLowerCase().includes(keyword);
            const matchesStatus = !status || order.status === status;
            const matchesDate = !date || order.date === date;
            return matchesKeyword && matchesStatus && matchesDate;
        });

        const totalPages = Math.max(1, Math.ceil(filtered.length / deliveryPageSize));
        deliveryCurrentPage = Math.min(deliveryCurrentPage, totalPages);

        const start = (deliveryCurrentPage - 1) * deliveryPageSize;
        const visible = filtered.slice(start, start + deliveryPageSize);
        const tbody = document.getElementById("deliveryTableBody");
        tbody.innerHTML = "";

        if (visible.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" style="text-align:center;padding:35px">
                        Không tìm thấy đơn giao hàng
                    </td>
                </tr>`;
        } else {
            visible.forEach(order => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>${order.id}</strong></td>
                    <td>${order.customer}</td>
                    <td>${order.time} - ${order.date.split("-").reverse().join("/")}</td>
                    <td><strong>${formatDeliveryMoney(order.total)}</strong></td>
                    <td><span class="status ${deliveryStatusClasses[order.status]}">
                        ${deliveryStatusNames[order.status]}
                    </span></td>
                    <td>
                        <select class="delivery-select" aria-label="Cập nhật trạng thái ${order.id}"
                                onchange="updateDeliveryStatus('${order.id}', this.value)">
                            <option value="WAITING" ${order.status === "WAITING" ? "selected" : ""}>Chờ bàn giao</option>
                            <option value="DELIVERING" ${order.status === "DELIVERING" ? "selected" : ""}>Đang giao</option>
                            <option value="DELIVERED" ${order.status === "DELIVERED" ? "selected" : ""}>Giao thành công</option>
                            <option value="FAILED" ${order.status === "FAILED" ? "selected" : ""}>Giao thất bại</option>
                        </select>
                    </td>`;
                tbody.appendChild(tr);
            });
        }

        document.getElementById("deliveryResultCount").textContent = filtered.length + " đơn hàng";
        document.getElementById("deliveryPageInfo").textContent =
            "Trang " + deliveryCurrentPage + " / " + totalPages;
        document.getElementById("deliveryPrevPage").disabled = deliveryCurrentPage === 1;
        document.getElementById("deliveryNextPage").disabled = deliveryCurrentPage === totalPages;
    }

    function updateDeliveryStatus(id, newStatus) {
        const order = deliveryOrders.find(o => o.id === id);
        if (!order) return;
        order.status = newStatus;
        updateDeliveryStatistics();
        renderDeliveryOrders();
    }

    document.getElementById("searchDelivery").addEventListener("input", () => {
        deliveryCurrentPage = 1;
        renderDeliveryOrders();
    });

    document.getElementById("deliveryStatus").addEventListener("change", () => {
        deliveryCurrentPage = 1;
        renderDeliveryOrders();
    });

    document.getElementById("deliveryDate").addEventListener("change", () => {
        deliveryCurrentPage = 1;
        renderDeliveryOrders();
    });

    document.getElementById("deliveryPrevPage").addEventListener("click", () => {
        if (deliveryCurrentPage > 1) {
            deliveryCurrentPage--;
            renderDeliveryOrders();
        }
    });

    document.getElementById("deliveryNextPage").addEventListener("click", () => {
        deliveryCurrentPage++;
        renderDeliveryOrders();
    });

    // Mặc định chọn ngày hôm nay theo giờ máy người dùng
    document.getElementById("deliveryDate").value = todayISO;

    updateDeliveryStatistics();
    renderDeliveryOrders();

</script>
</th:block>
</body>
</html>
