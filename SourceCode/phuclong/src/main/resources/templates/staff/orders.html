<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{staff/layout :: layout('Quản lý đơn hàng', 'orders', ~{::pageContent})}">
<body>
<th:block th:fragment="pageContent">
<section class="page-content orders-page">
<!-- PAGE HEADING -->
<div class="page-heading">
<div>
<h2>Quản lý đơn hàng</h2>
<p>Theo dõi và quản lý toàn bộ đơn hàng của cửa hàng</p>
</div>
<button class="btn-primary" onclick="alert('Chức năng tạo đơn hàng sẽ được bổ sung sau')" type="button">
<i class="fa-solid fa-plus"></i>
                    Tạo đơn hàng
                </button>
</div>
<!-- STATISTICS -->
<div class="stats-grid">
<div class="stat-card">
<div class="stat-top">
                        Tổng đơn hàng
                        <div class="stat-icon">
<i class="fa-solid fa-receipt"></i>
</div>
</div>
<div class="stat-number" id="totalOrders">0</div>
</div>
<div class="stat-card">
<div class="stat-top">
                        Chờ xác nhận
                        <div class="stat-icon">
<i class="fa-solid fa-clock"></i>
</div>
</div>
<div class="stat-number" id="pendingOrders">0</div>
</div>
<div class="stat-card">
<div class="stat-top">
                        Đang xử lý
                        <div class="stat-icon">
<i class="fa-solid fa-mug-hot"></i>
</div>
</div>
<div class="stat-number" id="processingOrders">0</div>
</div>
<div class="stat-card">
<div class="stat-top">
                        Hoàn tất
                        <div class="stat-icon">
<i class="fa-solid fa-circle-check"></i>
</div>
</div>
<div class="stat-number" id="completedOrders">0</div>
</div>
</div>
<!-- FILTER -->
<div class="filter-card">
<div class="filter-title">
<i class="fa-solid fa-filter"></i>
                    Tìm kiếm và lọc đơn hàng
                </div>
<div class="filter-grid">
<input id="searchOrder" placeholder="Tìm mã đơn hoặc tên khách hàng..." type="text"/>
<select id="statusFilter">
<option value="">Tất cả trạng thái</option>
<option value="PENDING">Chờ xác nhận</option>
<option value="CONFIRMED">Đã xác nhận</option>
<option value="PREPARING">Đang pha chế</option>
<option value="READY">Sẵn sàng</option>
<option value="DELIVERING">Đang giao</option>
<option value="COMPLETED">Hoàn tất</option>
<option value="CANCELLED">Đã hủy</option>
</select>
<input id="dateFilter" type="date"/>
</div>
</div>
<!-- TABLE -->
<div class="table-card">
<div class="table-header">
<h3>Danh sách đơn hàng</h3>
<span id="resultCount">0 đơn hàng</span>
</div>
<div class="table-wrapper">
<table>
<thead>
<tr>
<th>Mã đơn</th>
<th>Khách hàng</th>
<th>Thời gian</th>
<th>Tổng tiền</th>
<th>Trạng thái</th>
<th>Thao tác</th>
</tr>
</thead>
<tbody id="orderTableBody"></tbody>
</table>
</div>
<div class="pagination">
<span id="pageInfo">Trang 1</span>
<div>
<button id="prevPage" type="button">Trước</button>
<button id="nextPage" type="button">Sau</button>
</div>
</div>
</div>
</section>
<script>
    // DỮ LIỆU MẪU - CHƯA KẾT NỐI DATABASE
    const sampleOrders = [
        {
            id: "DH1001",
            customer: "Nguyễn Văn An",
            time: "21/11/2026 09:30",
            date: "2026-11-21",
            total: 75000,
            status: "PENDING"
        },
        {
            id: "DH1002",
            customer: "Trần Thị Bình",
            time: "21/11/2026 10:15",
            date: "2026-11-21",
            total: 120000,
            status: "CONFIRMED"
        },
        {
            id: "DH1003",
            customer: "Lê Hoàng Nam",
            time: "21/11/2026 10:45",
            date: "2026-11-21",
            total: 95000,
            status: "PREPARING"
        },
        {
            id: "DH1004",
            customer: "Phạm Minh Anh",
            time: "21/11/2026 11:20",
            date: "2026-11-21",
            total: 65000,
            status: "READY"
        },
        {
            id: "DH1005",
            customer: "Nguyễn Thị Hoa",
            time: "21/11/2026 12:00",
            date: "2026-11-21",
            total: 145000,
            status: "DELIVERING"
        },
        {
            id: "DH1006",
            customer: "Trần Quốc Bảo",
            time: "21/11/2026 13:10",
            date: "2026-11-21",
            total: 85000,
            status: "COMPLETED"
        },
        {
            id: "DH1007",
            customer: "Đỗ Minh Tuấn",
            time: "21/11/2026 14:00",
            date: "2026-11-21",
            total: 55000,
            status: "CANCELLED"
        }
    ];

    const statusNames = {
        PENDING: "Chờ xác nhận",
        CONFIRMED: "Đã xác nhận",
        PREPARING: "Đang pha chế",
        READY: "Sẵn sàng",
        DELIVERING: "Đang giao",
        COMPLETED: "Hoàn tất",
        CANCELLED: "Đã hủy"
    };

    const statusClasses = {
        PENDING: "pending",
        CONFIRMED: "confirmed",
        PREPARING: "preparing",
        READY: "ready",
        DELIVERING: "delivering",
        COMPLETED: "completed",
        CANCELLED: "cancelled"
    };

    let currentPage = 1;
    const pageSize = 5;

    function formatMoney(amount) {
        return amount.toLocaleString("vi-VN") + " ₫";
    }

    function updateStatistics() {
        document.getElementById("totalOrders").textContent =
            sampleOrders.length;

        document.getElementById("pendingOrders").textContent =
            sampleOrders.filter(o => o.status === "PENDING").length;

        document.getElementById("processingOrders").textContent =
            sampleOrders.filter(o =>
                ["CONFIRMED", "PREPARING", "READY", "DELIVERING"]
                    .includes(o.status)
            ).length;

        document.getElementById("completedOrders").textContent =
            sampleOrders.filter(o => o.status === "COMPLETED").length;
    }

    function renderOrders() {
        const keyword = document.getElementById("searchOrder")
            .value.trim().toLowerCase();

        const status = document.getElementById("statusFilter").value;
        const date = document.getElementById("dateFilter").value;

        const filteredOrders = sampleOrders.filter(order => {
            const matchesKeyword =
                order.id.toLowerCase().includes(keyword) ||
                order.customer.toLowerCase().includes(keyword);

            const matchesStatus = !status || order.status === status;
            const matchesDate = !date || order.date === date;

            return matchesKeyword && matchesStatus && matchesDate;
        });

        const totalPages = Math.max(1, Math.ceil(filteredOrders.length / pageSize));

        if (currentPage > totalPages) {
            currentPage = totalPages;
        }

        const start = (currentPage - 1) * pageSize;
        const visibleOrders = filteredOrders.slice(start, start + pageSize);

        const tbody = document.getElementById("orderTableBody");
        tbody.innerHTML = "";

        if (visibleOrders.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" style="text-align:center;padding:35px">
                        Không tìm thấy đơn hàng
                    </td>
                </tr>`;
        } else {
            visibleOrders.forEach(order => {
                const tr = document.createElement("tr");

                tr.innerHTML = `
                    <td><strong>${order.id}</strong></td>
                    <td>${order.customer}</td>
                    <td>${order.time}</td>
                    <td><strong>${formatMoney(order.total)}</strong></td>
                    <td>
                        <span class="status ${statusClasses[order.status]}">
                            ${statusNames[order.status]}
                        </span>
                    </td>
                    <td>
                        <button class="action-btn"
                                type="button"
                                onclick="viewOrder('${order.id}')">
                            <i class="fa-solid fa-eye"></i>
                            Xem
                        </button>
                    </td>
                `;

                tbody.appendChild(tr);
            });
        }

        document.getElementById("resultCount").textContent =
            filteredOrders.length + " đơn hàng";

        document.getElementById("pageInfo").textContent =
            "Trang " + currentPage + " / " + totalPages;

        document.getElementById("prevPage").disabled = currentPage === 1;
        document.getElementById("nextPage").disabled =
            currentPage === totalPages;
    }

    function viewOrder(id) {
        const order = sampleOrders.find(o => o.id === id);

        if (order) {
            alert(
                "Mã đơn: " + order.id +
                "\nKhách hàng: " + order.customer +
                "\nThời gian: " + order.time +
                "\nTổng tiền: " + formatMoney(order.total) +
                "\nTrạng thái: " + statusNames[order.status]
            );
        }
    }

    document.getElementById("searchOrder").addEventListener("input", () => {
        currentPage = 1;
        renderOrders();
    });

    document.getElementById("statusFilter").addEventListener("change", () => {
        currentPage = 1;
        renderOrders();
    });

    document.getElementById("dateFilter").addEventListener("change", () => {
        currentPage = 1;
        renderOrders();
    });

    document.getElementById("prevPage").addEventListener("click", () => {
        if (currentPage > 1) {
            currentPage--;
            renderOrders();
        }
    });

    document.getElementById("nextPage").addEventListener("click", () => {
        currentPage++;
        renderOrders();
    });

    updateStatistics();
    renderOrders();
</script>
</th:block>
</body>
</html>
